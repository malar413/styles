name: Field Companion Android Build

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build unsigned release APK
        run: gradle --no-daemon clean :app:assembleRelease
      - name: Align release and export apksigner
        run: |
          mkdir -p dist/signing-tools
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 "$APK" dist/FieldCompanion-0.2.2-p1-preview-release-aligned-unsigned.apk
          "$BT/zipalign" -c -p 4 dist/FieldCompanion-0.2.2-p1-preview-release-aligned-unsigned.apk
          cp "$BT/lib/apksigner.jar" dist/signing-tools/
          sha256sum dist/FieldCompanion-0.2.2-p1-preview-release-aligned-unsigned.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FieldCompanion-Aligned-Release-And-Apksigner
          path: dist/*
          if-no-files-found: error
          retention-days: 7
