name: Field Companion Android Build

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build debug APK
        run: gradle --no-daemon clean :app:assembleDebug
      - name: Inspect APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "Build tools: $BT"
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          "$BT/aapt" dump badging "$APK"
          unzip -t "$APK"
      - name: Copy named APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/FieldCompanion-0.2.1-p1-preview-debug.apk
          sha256sum dist/FieldCompanion-0.2.1-p1-preview-debug.apk | tee dist/SHA256SUMS.txt
      - name: Boot emulator and install APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm path ca.larose.fieldcompanion.p1preview
            adb shell am start -W -n ca.larose.fieldcompanion.p1preview/ca.larose.fieldcompanion.MainActivity
      - uses: actions/upload-artifact@v4
        with:
          name: FieldCompanion-APK
          path: dist/*
          if-no-files-found: error
          retention-days: 7
