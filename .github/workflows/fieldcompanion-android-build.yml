name: Field Companion Android Build

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Download embedded AI models
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/assets/ai

          CORAL=https://raw.githubusercontent.com/google-coral/test_data/master
          curl -L --fail --retry 3 "$CORAL/mobilenet_v2_1.0_224_inat_bird_quant.tflite" -o app/src/main/assets/ai/inat_bird.tflite
          curl -L --fail --retry 3 "$CORAL/mobilenet_v2_1.0_224_inat_insect_quant.tflite" -o app/src/main/assets/ai/inat_insect.tflite
          curl -L --fail --retry 3 "$CORAL/inat_bird_labels.txt" -o app/src/main/assets/ai/inat_bird_labels.txt
          curl -L --fail --retry 3 "$CORAL/inat_insect_labels.txt" -o app/src/main/assets/ai/inat_insect_labels.txt
          curl -L --fail --retry 3 "$CORAL/LICENSE" -o app/src/main/assets/ai/GOOGLE_CORAL_TEST_DATA_LICENSE.txt

          HF=https://huggingface.co/crazedcodernate/bioclip-2.5-mobile-fastvit/resolve/main
          curl -L --fail --retry 3 "$HF/flora_student_fp16.onnx?download=true" -o app/src/main/assets/ai/flora_student_fp16.onnx
          curl -L --fail --retry 3 "$HF/taxa_table.npy?download=true" -o /tmp/flora_taxa_table.npy
          curl -L --fail --retry 3 "$HF/taxa_labels.json?download=true" -o /tmp/flora_taxa_labels.json

          python3 -m pip install --quiet numpy
          python3 - <<'PY'
          import json, numpy as np
          labels=json.load(open('/tmp/flora_taxa_labels.json',encoding='utf-8'))
          table=np.load('/tmp/flora_taxa_table.npy').astype('<f4', copy=False)
          assert table.shape == (len(labels),1024), (table.shape,len(labels))
          names=[]
          for row in labels:
              if isinstance(row,str):
                  names.append(row)
              else:
                  names.append(row.get('scientific') or row.get('name') or row.get('label') or '')
          assert all(names)
          open('app/src/main/assets/ai/flora_taxa_labels.txt','w',encoding='utf-8').write('\n'.join(names)+'\n')
          table.tofile('app/src/main/assets/ai/flora_taxa_table_f32.bin')
          beg=[x for x in names if x.lower().startswith('begonia ')]
          print('BioCLIP flora taxa:',len(names))
          print('BioCLIP Begonia taxa:',len(beg))
          PY


          HOUSE=https://huggingface.co/onnx-community/house-plant-image-detection-ONNX/resolve/main
          curl -L --fail --retry 3 "$HOUSE/onnx/model_q4.onnx?download=true" -o app/src/main/assets/ai/houseplant_q4.onnx
          curl -L --fail --retry 3 "$HOUSE/config.json?download=true" -o /tmp/houseplant_config.json
          python3 - <<'PY'
          import json
          cfg=json.load(open('/tmp/houseplant_config.json',encoding='utf-8'))
          m=cfg.get('id2label',{})
          labels=[m[str(i)] for i in range(len(m))]
          open('app/src/main/assets/ai/houseplant_labels.txt','w',encoding='utf-8').write('\\n'.join(labels)+'\\n')
          matches=[x for x in labels if 'begonia' in x.lower()]
          print('Cultivated-plant classes:',len(labels))
          print('Begonia classes:',matches)
          assert matches, 'Cultivated plant expert has no Begonia class'
          PY
          cat > app/src/main/assets/ai/HOUSEPLANT_EXPERT_ATTRIBUTION.txt <<'EOF'
          ONNX community conversion of dima806/house-plant-image-detection.
          Source: https://huggingface.co/onnx-community/house-plant-image-detection-ONNX
          License: Apache-2.0.
          EOF

          cat > app/src/main/assets/ai/BIOCLIP_MOBILE_ATTRIBUTION.txt <<'EOF'
          BioCLIP 2.5 Mobile (FastViT student), Nate Hamilton / CrazedCoderNate.
          Model: https://huggingface.co/crazedcodernate/bioclip-2.5-mobile-fastvit
          Training code: https://github.com/CrazedCoderNate/bioclip-mobile-distill
          License: MIT. Teacher BioCLIP 2.5 by the Imageomics Institute, MIT.
          EOF

          ls -lh app/src/main/assets/ai

      - name: Build unsigned release APK
        run: gradle --no-daemon clean :app:assembleRelease

      - name: Align release and export apksigner
        run: |
          set -euxo pipefail
          mkdir -p dist/signing-tools
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 "$APK" dist/FieldCompanion-0.4.0-ai2-release-aligned-unsigned.apk
          "$BT/zipalign" -c -v 4 dist/FieldCompanion-0.4.0-ai2-release-aligned-unsigned.apk
          cp "$BT/lib/apksigner.jar" dist/signing-tools/
          "$BT/aapt" dump badging dist/FieldCompanion-0.4.0-ai2-release-aligned-unsigned.apk | head -20
          sha256sum dist/FieldCompanion-0.4.0-ai2-release-aligned-unsigned.apk > dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: FieldCompanion-0.4.0-AI2-Aligned-Release
          path: dist/*
          if-no-files-found: error
          retention-days: 7
