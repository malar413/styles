name: Field Companion Android Build

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build unsigned release APK
        run: gradle --no-daemon clean :app:assembleRelease
      - name: Inspect unsigned release
        run: |
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt" dump badging "$APK"
          unzip -t "$APK"
      - name: Package unsigned release
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release-unsigned.apk dist/FieldCompanion-0.2.1-p1-preview-release-unsigned.apk
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FieldCompanion-Unsigned-Release
          path: dist/*
          if-no-files-found: error
          retention-days: 7
