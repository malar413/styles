name: Field Companion Android Build

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Download embedded iNaturalist models
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/assets/ai
          BASE=https://raw.githubusercontent.com/google-coral/test_data/master
          curl -L --fail --retry 3 "$BASE/mobilenet_v2_1.0_224_inat_bird_quant.tflite" -o app/src/main/assets/ai/inat_bird.tflite
          curl -L --fail --retry 3 "$BASE/mobilenet_v2_1.0_224_inat_plant_quant.tflite" -o app/src/main/assets/ai/inat_plant.tflite
          curl -L --fail --retry 3 "$BASE/mobilenet_v2_1.0_224_inat_insect_quant.tflite" -o app/src/main/assets/ai/inat_insect.tflite
          curl -L --fail --retry 3 "$BASE/inat_bird_labels.txt" -o app/src/main/assets/ai/inat_bird_labels.txt
          curl -L --fail --retry 3 "$BASE/inat_plant_labels.txt" -o app/src/main/assets/ai/inat_plant_labels.txt
          curl -L --fail --retry 3 "$BASE/inat_insect_labels.txt" -o app/src/main/assets/ai/inat_insect_labels.txt
          curl -L --fail --retry 3 "$BASE/LICENSE" -o app/src/main/assets/ai/GOOGLE_CORAL_TEST_DATA_LICENSE.txt
          ls -lh app/src/main/assets/ai

      - name: Build unsigned release APK
        run: gradle --no-daemon clean :app:assembleRelease

      - name: Align release and export apksigner
        run: |
          set -euxo pipefail
          mkdir -p dist/signing-tools
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 "$APK" dist/FieldCompanion-0.3.0-ai1-release-aligned-unsigned.apk
          "$BT/zipalign" -c -v 4 dist/FieldCompanion-0.3.0-ai1-release-aligned-unsigned.apk
          cp "$BT/lib/apksigner.jar" dist/signing-tools/
          "$BT/aapt" dump badging dist/FieldCompanion-0.3.0-ai1-release-aligned-unsigned.apk | head -20
          sha256sum dist/FieldCompanion-0.3.0-ai1-release-aligned-unsigned.apk > dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: FieldCompanion-0.3.0-AI1-Aligned-Release
          path: dist/*
          if-no-files-found: error
          retention-days: 7
