name: Field Companion Android Build

on:
  push:
    branches:
      - fieldcompanion-build-20261010
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Build debug APK
        run: gradle --no-daemon clean :app:assembleDebug
      - name: Copy named APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/FieldCompanion-0.2.0-p1-debug.apk
          sha256sum dist/FieldCompanion-0.2.0-p1-debug.apk | tee dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FieldCompanion-APK
          path: dist/*
          if-no-files-found: error
          retention-days: 7
