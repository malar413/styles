plugins {
    id 'com.android.application'
}

android {
    namespace 'ca.larose.fieldcompanion'
    compileSdk 36

    defaultConfig {
        applicationId 'ca.larose.fieldcompanion'
        minSdk 28
        targetSdk 36
        versionCode 2
        versionName '0.2.0-p1'
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
            versionNameSuffix '-debug'
        }
    }
}
