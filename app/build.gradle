plugins {
    id 'com.android.application'
}

android {
    namespace 'ca.larose.fieldcompanion'
    compileSdk 36

    defaultConfig {
        applicationId 'ca.larose.fieldcompanion.p1preview'
        minSdk 28
        targetSdk 36
        versionCode 5
        versionName '0.3.0-ai1'
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
            versionNameSuffix '-debug'
        }
    }
}


dependencies {
    implementation 'com.google.ai.edge.litert:litert:1.4.0'
}
