plugins {
    id 'com.android.application'
}

android {
    namespace 'ca.larose.fieldcompanion'
    compileSdk 36

    defaultConfig {
        applicationId 'ca.larose.fieldcompanion.p1preview'
        minSdk 28
        targetSdk 36
        versionCode 7
        versionName '0.4.1-ai2'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
            versionNameSuffix '-debug'
        }
    }
}


dependencies {
    implementation 'com.google.ai.edge.litert:litert:1.4.0'
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.31.0'
}
